<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flap Shoulder Bag</title>
  <link rel="stylesheet" href="Products.css">
  <link rel="icon" type="image/png" href="logo\logo.png">
  <link rel="apple-touch-icon" href="logo\logo.png">
</head>
<body>

<header>
  <div class="container">
    <h1>Galmnest</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
         <li>
            <button class="cart-btn" onclick="window.location.href='cart.html'">
            🛒
            <span id="cart-count">0</span>
            </button>
        </li>
    </ul>
    </nav>
  </div>
</header>

<section id="product-details">
  <div class="container product-details-container">

    <!-- Product Images -->
    <div class="product-images">

      <!-- MAIN IMAGE WITH ARROWS -->
      <div class="image-slider">
        <span class="arrow prev">&#10094;</span>
        <img src="images/bag8.jpeg" alt="Flap Shoulder Bag" class="main-image">
        <span class="arrow next">&#10095;</span>
      </div>

      <!-- THUMBNAILS -->
      <div class="other-images">
        <img src="images/bag8.jpeg" alt="Flap Shoulder Bag">
        <img src="images/bag81.avif" alt="Flap Shoulder Bag">
        <img src="images/bag84.avif" alt="Flap Shoulder Bag">
        <img src="images/bag82.avif" alt="Flap Shoulder Bag">
        <img src="images/bag83.avif" alt="Flap Shoulder Bag">
      </div>
    </div>

    <!-- Product Info -->
 <div class="product-info">
  <h2>Flap Shoulder Bag</h2>
  <p class="price">$49.99</p>
  <ul class="product-features">
    <li>Premium textured materials</li>
    <li>Secure flap closure</li>
    <li>Adjustable strap for comfort</li>
    <li>Suitable for everyday use or special occasions</li>
    <li>Subtle sophistication complements any outfit</li>
  </ul>
    <button class="btn" onclick="addToCart('Flap Shoulder Bag', 49.99, 'images/bag8.jfif')">Add to Cart</button>
    <button class="btn" onclick="window.location.href='checkout.html'">Checkout</button>
  </div>

   </section>
    <script src="script.js"></script>
<script>
  // Initialize cart from localStorage or empty array
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function addToCart(name, price, image) {
    // Add product to cart array
    cart.push({ name, price, image });
    
    // Save updated cart to localStorage
    localStorage.setItem('cart', JSON.stringify(cart));

    // Update cart count on page
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;

    // Optional: alert user
    alert(`${name} added to cart!`);
  }

  // On page load, update cart count
  document.addEventListener("DOMContentLoaded", () => {
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
 const images = [
    "images/bag8.jpeg",
    "images/bag81.avif",
    "images/bag84.avif",
    "images/bag82.avif",
    "images/bag83.avif"
];
  let currentIndex = 0;
  const mainImage = document.querySelector(".main-image");
  const thumbnails = document.querySelectorAll(".other-images img");
  const prevBtn = document.querySelector(".prev");
  const nextBtn = document.querySelector(".next");

  function updateImage(index) {
    currentIndex = index;
    mainImage.src = images[currentIndex];
  }

  // Thumbnail click
  thumbnails.forEach((img, index) => {
    img.addEventListener("click", () => {
      updateImage(index);
    });
  });

  // Next arrow
  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage(currentIndex);
  });

  // Previous arrow
  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage(currentIndex);
  });
});
</script>

</body>
</html>
