<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Tote</title>
  <link rel="stylesheet" href="Products.css">
  <link rel="icon" type="image/png" href="logo\logo.png">
  <link rel="apple-touch-icon" href="logo\logo.png">
</head>
<body>

<header>
  <div class="container">
    <h1>Galmnest</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
         <li>
            <button class="cart-btn" onclick="window.location.href='cart.html'">
            🛒
            <span id="cart-count">0</span>
            </button>
        </li>
      </ul>
    </nav>
  </div>
</header>

<section id="product-details">
  <div class="container product-details-container">

    <!-- Product Images -->
    <div class="product-images">

      <!-- IMAGE WRAPPER WITH ARROWS -->
      <div class="image-slider">
        <span class="arrow prev">&#10094;</span>

        <img src="images/bag1.jfif" alt="Classic Tote" class="main-image">

        <span class="arrow next">&#10095;</span>
      </div>

      <!-- Thumbnails -->
      <div class="other-images">
        <img src="images/bag1.jfif">
        <img src="images/bag13.jfif">
        <img src="images/bag14.jfif">
      </div>
    </div>

    <!-- Product Info -->
   <div class="product-info">
  <h2>Classic Tote</h2>
  <p class="price">$49.99</p>
  <ul class="product-features">
    <li>Timeless and practical design</li>
    <li>Sturdy build with roomy interior</li>
    <li>Sleek handles for easy carrying</li>
    <li>Blends fashion with functionality</li>
    <li>Reliable accessory for daily use</li>
  </ul>
    <button class="btn" onclick="addToCart('Classic Tote', 49.99, 'images/bag1.jfif')">Add to Cart</button>
    <button class="btn" onclick="window.location.href='checkout.html'">Checkout</button>
  </div>

</section>
  <script src="script.js"></script>
  <script>
  // Initialize cart from localStorage or empty array
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function addToCart(name, price, image) {
    // Add product to cart array
    cart.push({ name, price, image });
    
    // Save updated cart to localStorage
    localStorage.setItem('cart', JSON.stringify(cart));

    // Update cart count on page
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;

    // Optional: alert user
    alert(`${name} added to cart!`);
  }

  // On page load, update cart count
  document.addEventListener("DOMContentLoaded", () => {
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;
  });
</script>

<!-- IMAGE + ARROW FUNCTIONALITY -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const images = [
    "images/bag1.jfif",
    "images/bag12.jfif",
    "images/bag13.jfif",
    "images/bag14.jfif"
];


  let currentIndex = 0;
  const mainImage = document.querySelector(".main-image");
  const thumbnails = document.querySelectorAll(".other-images img");
  const prevBtn = document.querySelector(".prev");
  const nextBtn = document.querySelector(".next");

  function updateImage(index) {
    currentIndex = index;
    mainImage.src = images[currentIndex];
  }

  // Thumbnail click
  thumbnails.forEach((img, index) => {
    img.addEventListener("click", () => {
      updateImage(index);
    });
  });

  // Next arrow
  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage(currentIndex);
  });

  // Previous arrow
  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage(currentIndex);
  });
});
</script>

</body>
</html>
