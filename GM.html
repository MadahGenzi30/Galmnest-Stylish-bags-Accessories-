<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Mini Clutch</title>
  <link rel="stylesheet" href="Products.css">
  <link rel="icon" type="image/png" href="logo\logo.png">
  <link rel="apple-touch-icon" href="logo\logo.png">
</head>
<body>

<header>
  <div class="container">
    <h1>GlamNest &#10024;</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
         <li>
            <button class="cart-btn" onclick="window.location.href='cart.html'">
            🛒
            <span id="cart-count">0</span>
            </button>
        </li>
    </ul>
    </nav>
  </div>
</header>

<section id="product-details">
  <div class="container product-details-container">

    <!-- Product Images with Arrows -->
    <div class="product-images">
      <div class="image-slider">
        <span class="arrow prev">&#10094;</span>
        <img src="images/bag9.avif" alt="Gold Mini Clutch" class="main-image">
        <span class="arrow next">&#10095;</span>
      </div>

      <!-- Thumbnails -->
      <div class="other-images">
        <img src="images/bag9.avif" alt="Gold Mini Clutch">
        <img src="images/bag91.webp" alt="Gold Mini Clutch">
        <img src="images/bag92.avif" alt="Gold Mini Clutch">
        <img src="images/bag93.jpg" alt="Gold Mini Clutch">
      </div>
    </div>

   <div class="product-info">
  <h2>Gold Mini Clutch</h2>
  <p class="price">$49.99</p>
  <ul class="product-features">
    <li>Compact and luxurious design</li>
    <li>Eye-catching metallic accents</li>
    <li>Secure closure for essentials</li>
    <li>Perfect for evenings and parties</li>
    <li>Adds a glamorous touch to any outfit</li>
  </ul>
    <button class="btn" onclick="addToCart('Gold Mini Bag', 49.99, 'images/bag9.jfif')">Add to Cart</button>
    <button class="btn" onclick="window.location.href='checkout.html'">Checkout</button>
  </div>

</section>
 <script src="script.js"></script>
 <script>
  // Initialize cart from localStorage or empty array
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function addToCart(name, price, image) {
    // Add product to cart array
    cart.push({ name, price, image });
    
    // Save updated cart to localStorage
    localStorage.setItem('cart', JSON.stringify(cart));

    // Update cart count on page
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;

    // Optional: alert user
    alert(`${name} added to cart!`);
  }

  // On page load, update cart count
  document.addEventListener("DOMContentLoaded", () => {
    const cartCount = document.getElementById('cart-count');
    cartCount.textContent = cart.length;
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const images = [
    "images/bag9.avif",
    "images/bag91.webp",
    "images/bag92.avif",
    "images/bag93.jpg"
];


  let currentIndex = 0;
  const mainImage = document.querySelector(".main-image");
  const thumbnails = document.querySelectorAll(".other-images img");
  const prevBtn = document.querySelector(".prev");
  const nextBtn = document.querySelector(".next");

  function updateImage(index) {
    currentIndex = index;
    mainImage.src = images[currentIndex];
  }

  // Thumbnail click
  thumbnails.forEach((img, index) => {
    img.addEventListener("click", () => {
      updateImage(index);
    });
  });

  // Next arrow
  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage(currentIndex);
  });

  // Previous arrow
  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage(currentIndex);
  });
});
</script>


</body>
</html>
